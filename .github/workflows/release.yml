name: Release

# On demand only. Nothing ships because a tag or a commit appeared; a release
# happens when a person goes to the Actions tab and asks for one.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, e.g. 0.2.0 (the v-tag is created for you)"
        required: true
        type: string
      signing_key:
        description: "Sparkle EdDSA private key. Leave blank to use the SPARKLE_PRIVATE_KEY secret. SEE THE WARNING IN docs/RELEASING.md BEFORE PASTING ONE HERE."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # release.sh derives CFBundleVersion from the commit count, so the
          # full history has to be here or every build would number itself 1.
          fetch-depth: 0

      - name: Take the signing key
        env:
          PASTED_KEY: ${{ inputs.signing_key }}
          STORED_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          KEY="${PASTED_KEY:-$STORED_KEY}"
          if [ -z "$KEY" ]; then
            echo "::error::No signing key. Paste one when running the workflow, or add a SPARKLE_PRIVATE_KEY secret."
            exit 1
          fi
          # Keep it out of the logs. This does NOT hide a pasted key from the
          # run's own event payload — see docs/RELEASING.md.
          echo "::add-mask::$KEY"
          echo "SPARKLE_PRIVATE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Work out the version
        id: v
        run: |
          VERSION="${{ inputs.version }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Refuse to ship a blank changelog
        run: |
          NOTES="release-notes/${{ steps.v.outputs.version }}.html"
          if [ ! -f "$NOTES" ]; then
            echo "::error file=$NOTES::Write $NOTES before releasing — without it the update panel is empty."
            exit 1
          fi

      # The runner's Xcode is older than a typical dev machine's, so it builds
      # against an older SDK. Logged because that difference is the most likely
      # reason a build that passes locally fails here.
      - name: Toolchain
        run: |
          xcodebuild -version
          echo "macOS SDK: $(xcrun --sdk macosx --show-sdk-version)"

      - name: Test
        run: swift test --package-path FinelloKit

      - name: Build, package and sign
        run: ./scripts/release.sh "${{ steps.v.outputs.version }}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          TAG="${{ steps.v.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/finello-$VERSION.zip" --clobber
          else
            gh release create "$TAG" \
              --title "finello $VERSION" \
              --notes-file "release-notes/$VERSION.html" \
              --target "$GITHUB_SHA" \
              "dist/finello-$VERSION.zip"
          fi

      - name: Publish the appcast
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          # Move to main explicitly so the feed lands where SUFeedURL points,
          # whatever commit this run was started from.
          git fetch origin main
          git checkout -B main origin/main
          cp dist/appcast.xml appcast.xml
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          if git diff --cached --quiet; then
            echo "Appcast unchanged."
          else
            git commit -m "Publish appcast for $VERSION"
            git push origin main
          fi
